[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shockit"
version = "0.1.0"
description = "A Python toolkit for shock detection and characterization in simulation data."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hitesh Kishore Das" }]
dependencies = [
  "numpy",
  "scipy",
  "h5py",
]

[project.urls]
Homepage = "https://github.com/HiteshKishoreDas/shockit"
Repository = "https://github.com/HiteshKishoreDas/shockit"
Issues = "https://github.com/HiteshKishoreDas/shockit/issues"

[project.optional-dependencies]
plots = [
  "matplotlib",
]
dev = [
  "pytest",
  "matplotlib",
]

[project.scripts]
shockit = "shockit.cli:main"
shockit-find = "shockit.cli:main"

[tool.setuptools.packages.find]
include = ["shockit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
